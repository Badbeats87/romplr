; PlatformIO config for Teensy 4.1 Rompler
;
; Hardware: Teensy 4.1 + Audio Shield (SGTL5000) + USB Host MIDI
; Build:    pio run
; Upload:   pio run --target upload
; Monitor:  pio device monitor -b 115200

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Teensy 4.1: 600MHz Cortex-M7
board_build.f_cpu = 600000000L

; USB type: Serial (for debug output)
build_flags =
    -DPLATFORM_TEENSY
    -DPLATFORM_SINGLE_CORE
    -DSTREAM_FROM_SD
    -DMAX_INSTRUMENTS=128
    -DMAX_VOICES=8
    -DNUM_PATCHES=128
    -DSYNTH_SAMPLE_RATE=44100u
    -Wall
    -Wno-unused-variable

extra_scripts = pre:extra_script.py

upload_protocol = teensy-cli
monitor_speed = 115200
